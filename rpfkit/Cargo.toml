[package]
name = "rpfkit"
version = "0.1.0"
edition = "2024"
description = "Clean-room RPF9 (GTA VI Xbox) archive reader: structural validation and extraction, with AES-NI and multithreading. Ships a native Python extension module."
license = "Apache-2.0"

# The library mirrors the Python package under gta6/rpf9/ (format, entries, crypto,
# archive, validate). The binary is a thin CLI over it. Release builds target the host
# CPU so the aes crate emits AES-NI; rayon parallelises across archives/entries.
#
# `cdylib` produces the Python extension module (the `python` feature, built by
# maturin); `rlib` keeps `cargo test` and the `[[bin]]` working. The cdylib is inert
# without the `python` feature, so a plain `cargo build` does not pull in pyo3.
[lib]
name = "rpfkit"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rpfkit"
path = "src/main.rs"

[dependencies]
# aes uses hardware AES-NI intrinsics on x86_64 automatically (via the cipher
# traits); it falls back to a constant-time software path elsewhere.
aes = "0.9.4"
cipher = "0.5.2"
clap = { version = "4.6.9", features = ["derive"] }
# raw-deflate (wbits = -15) inflate for the cleartext data region.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
goblin = "0.10.7"
memmap2 = "0.9.12"
rayon = "1.12.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
# Optional native Python bindings. Enable with `--features python` (maturin does this
# via [tool.maturin] dependencies). abi3 builds one wheel for CPython 3.9+.
pyo3 = { version = "0.30.1", features = ["abi3-py39"], optional = true }
# Win32 calls for the `net-offline` helper (UAC elevation + process wait). Windows-only;
# the firewall rules themselves are driven through `netsh advfirewall` (see net_offline.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

[features]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
