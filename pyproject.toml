[build-system]
requires = ["hatchling>1.25"]
build-backend = "hatchling.build"

[project]
name = "gta6"
dynamic = ["version"]
description = "Reverse-engineering notes and extraction tooling for GTA VI (Xbox layout)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
dependencies = [
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
gta6 = "gta6.cli:main"

[tool.hatch.version]
path = "gta6/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gta6"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]